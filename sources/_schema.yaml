# sources/_schema.yaml — co-located schema for SOURCE INSTANCES and the §6.2 score
# vocabulary of record (design §6.1–§6.2; SV4 §11.1/§13.4). Framework mechanism (§10).
# NOT a dimension: a source is a pluggable, READ-ONLY grounding provider (§6.1) in two
# layers — the ADAPTER (type: `graphify`, `folder`, `url`, `pdf`, …) is CODE declaring
# query capabilities (v1 ships graphify + folder, T11; pipeline/adapters/, step 18),
# never a registry entry; the SOURCE INSTANCE (bound config + characterization scores
# + a content-kind tag) is the entry shape THIS manifest declares.
#
# The framework ships NO source entries: instances are client/instance data —
# `provenance: instance`, `x-` prefixed (§11.4), normally under
# `workspaces/<client>/sources/` (the workspace declares the source pool, §6.1; scope
# by location, §10). Durable rules ride every instance: source/client repos are
# READ-ONLY always (CLAUDE.md rule 1 — e.g. graphify reads
# `<client-checkout>/graphify-out/graph.json` by path); connection config must never
# carry secrets (§3.3).
#
# THE §6.2 SCORE SET, defined once here ("each defined once in the source schema" —
# one fixed type and scale per score, so any two values of one score are comparable).
# §6.2 requires each declaration to carry type · scale/enum · default · definition ·
# definition_version · asserted/derived/semi · attach tier; the closed §11.1 manifest
# vocabulary carries scale/enum inside `type` and the asserted/derived + attach facts
# inside the `definition` prose. Attach tiers (§6.1, Q10):
#   instance      trusted · independence · primariness       (set on the entry)
#   content-kind  authoritative · opinionated · freshness    (default bundles live on
#                 (+ review_status, SM6)                      content-kinds/ entries)
#   per-fact      corroboration · traceability               (derived at ground time,
#                                                             never persisted as config)
# Kind-tier and per-fact scores are still DECLARED here as the vocabulary of record
# and for the §6.2 user-assertion path: a user MAY assert a value over a derived
# score; the assertion rides the cascade as authoritative config, is stamped for
# provenance, and large divergence from the computed value fires a ONE-TIME advisory
# lint — never a block (§6.2; PA-9a, step 17). Selection references CHARACTERISTICS,
# never identity: scores and kind tags only, never source ids (§6.3) — a new instance
# with the right scores is automatically eligible with zero recipe changes.
schema_version: 1
attributes:
  adapter:
    type: text
    default: ""
    definition: >-
      The adapter TYPE this instance binds (§6.1: `graphify`, `folder`, `url`, `pdf`,
      … — an open list; v1 ships graphify + folder, T11). Adapters are framework code
      declaring query capabilities, not registry entries; an unknown adapter name
      fails loudly at ground time (step 18). Empty = unbound (never usable).
    definition_version: 1
  connection:
    type: map
    default: {}
    definition: >-
      Adapter-specific bound config (§6.1 "connection details") — e.g. graphify:
      `path: <client-checkout>/graphify-out/graph.json` (read by path, rule 1;
      graphs are never stored in this repo). READ-ONLY toward every source (§6.1);
      must never carry secrets/credentials (§3.3).
    definition_version: 1
  content_kind:
    type: ref
    default: general
    definition: >-
      The content-kind tag (§6.1 SM5): the content-kinds/ entry whose default score
      bundle characterizes what this instance's content IS. The floor names the
      shipped neutral kind `general` (so the floor always resolves); an unknown id
      fails loudly at M1 resolution (§11.1). Instance-specific deviations from a
      kind's defaults are `extends:` field-merge partials over the KIND entry
      (Mechanism 1, §12.1), never edits to shipped entries (§10 rule 2).
    definition_version: 1
  trusted:
    type: slider
    default: 3
    definition: >-
      §6.2 score `trusted` (scalar 1-5; ASSERTED; attach: instance). The user's
      standing trust in this source relationship/track record: 1 = little trust
      (unproven or unreliable); 3 = uncharacterized middle (the floor); 5 = fully
      trusted (a long, reliable track record). Serves selection and conflict priority.
    definition_version: 1
  independence:
    type:
      type: enum
      values: [first-party, affiliated, independent]
    default: first-party
    definition: >-
      §6.2 score `independence` (ordinal; ASSERTED, machine-hintable; attach: instance
      -> kind refine). Serves selection (compare, establish-authority) and gates the
      corroboration upgrade — confidence rises only on agreement across GENUINELY
      independent instances (§6.5). The floor is `first-party`: the conservative end,
      so an uncharacterized instance can never fake the independence that corroboration
      arithmetic rewards.
    definition_version: 1
  primariness:
    type:
      type: enum
      values: [primary, secondary, tertiary]
    default: secondary
    definition: >-
      §6.2 score `primariness` (ordinal; SEMI-DERIVED; attach: instance -> per-fact
      refine). Whether this source originates the facts it carries or relays them.
      Serves selection and conflict tie-break. Floor `secondary` = the uncharacterized
      middle; asserting `primary` is the user's explicit act.
    definition_version: 1
  authoritative:
    type: slider
    default: 3
    definition: >-
      §6.2 score `authoritative` (scalar 1-5; asserted default per kind; attach:
      CONTENT-KIND -> per-fact). How definitive this source is about its subject: 1 =
      casual/unvetted; 3 = credible but non-authoritative (the middle); 5 = the
      definitive record. Vocabulary of record for the kind-tier score whose default
      bundle lives on content-kinds/ entries (§6.1 SM5). A value set on a source entry
      is a per-instance user assertion over the kind default (§6.2 — stamped,
      divergence advisory-linted once, step 17 PA-9a).
    definition_version: 1
  opinionated:
    type: slider
    default: 3
    definition: >-
      §6.2 score `opinionated` (scalar 1-5; asserted default per kind; attach:
      CONTENT-KIND -> per-fact). How much this source is stance/judgment rather than
      record: 1 = pure record/fact; 3 = mixed (the middle); 5 = heavily editorial.
      Vocabulary of record — kind default bundles live on content-kinds/ entries; a
      value here is a per-instance assertion (§6.2). Not the inverse of `authoritative`
      (§6.2).
    definition_version: 1
  freshness:
    type: text
    default: ""
    definition: >-
      §6.2 score `freshness` (type of record: date-window/range; DERIVED per-fact
      from commit/mtime; attach: content-kind policy / per-fact). The config-side
      carrier is a date-window POLICY/ASSERTION expression in the §6.2/§6.3 predicate
      vocabulary (e.g. "12mo"); empty = derived only. Serves filter + weight (§6.2);
      kind-level policy lives on content-kinds/ entries.
    definition_version: 1
  corroboration:
    type: number
    default: 0
    definition: >-
      §6.2 score `corroboration` (scalar 0-n; DERIVED per-fact: independent-instance
      agreement after union — recomputed each run, never persisted, §6.1). Upgrades
      confidence (§6.5); the positive complement of conflict-downgrade. Declared as
      vocabulary of record and for the §6.2 assertion path; a config-set value is a
      stamped user assertion (step 17 PA-9a).
    definition_version: 1
  traceability:
    type: bool
    default: false
    definition: >-
      §6.2 score `traceability` (boolean, optional depth deferred; DERIVED per-fact:
      a resolvable anchor — file:line, SHA, URL fragment). The citability gate input
      (§6.5, §19), independent of the confidence tier (SM9: tier ⟂ traceability).
      Floor `false` = not citable until an anchor resolves; a config-set `true` is a
      stamped user assertion (§6.2; step 17 PA-9a).
    definition_version: 1
