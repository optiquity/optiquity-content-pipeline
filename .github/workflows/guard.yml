# guard.yml — the public repo's CI gate (plan step 13): the PA-1 public-boundary guard +
# the SV11 schema-lint (design docs/design.md §10, §11.7).
#
# Q15 rule 5: the boundary guard's job is keeping the PUBLIC framework repo empty of
# instance/client content; the private instance does not run this workflow, so it can
# track its own content freely. Schema-lint (SV11) also runs here: framework-provenance
# default entries must always validate against their co-located schemas.
#
# Baseline wiring (RELEASE-relative, not per-commit): the SV11 diff clauses
# (schema-change-without-bump, meaning-change-without-step, premature-prune, MIG-1
# mutation) diff the checked-out tree against the LAST RELEASE — the commit named by the
# committed release marker (pipeline/released_baseline). PRE-RELEASE that marker is ABSENT,
# so there is no baseline and the diff clauses are inert: a version in development makes
# many schema changes before its release, and only the FIRST change AFTER a release must
# bump the global schema_version. The within-tree invariants (structural validity,
# cross-collection version equality, lockstep, entry/provenance validation) and the
# boundary guard ALWAYS run — so one identical `schema-lint.sh` gates both push and
# pull_request (no per-commit / PR-base diff). fetch-depth: 0 keeps a marker-named release
# commit reachable for `git show`; a committed marker needs no tag-fetch.
#
# The pytest suites covering both gates (tests/test_guard.py, tests/test_lint.py) run in
# the ci.yml test job.
name: guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a marker-named release commit is reachable for `git show`.
          fetch-depth: 0
      - name: Public-boundary guard (no client/instance content; PA-1 scope)
        run: bash scripts/check-no-content.sh
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          # Mirror the local toolchain (uv 0.11.16 verified on the dev machine, plan T1).
          version: "0.11.16"
      - name: Sync project venv from the lockfile
        run: uv sync --locked
      - name: Schema lint (SV11 + Q15 default-deny provenance + schema validation)
        # One identical invocation on push and pull_request: the default baseline is the
        # release marker (RELEASE-relative), so no per-commit / PR-base diff is needed.
        run: bash scripts/schema-lint.sh
