# formats/_schema.yaml — co-located schema for the Format content dimension
# (design §5.1, §5.2; SV4 §11.1/§13.4). Framework mechanism (provenance/scope: §10).
#
# Format = what shape/genre. Facets (§5.1): content / discrete-registry / single /
# override-projection NO. Format binds at M2-compose and enters `artifact-id` (§12.3);
# it shapes the IR's structure (§15).
#
# Formats are PLATFORM-AGNOSTIC GENRES (§5.2: `short-opinion-post`, `long-form-essay`,
# `readme`). There is NO `valid_platforms` attribute and NO hard compatibility data on
# any Format entry (Q4, §8): pairing is user-driven; the effective allow-list is
# emergent from configuration (§12); a strange pairing gets a one-time advisory lint
# (`nonsensical-pairing`, §8/§21.7), never a block. Platform-side per-format advisory
# projections and reconcile-strategy defaults live on Platform entries (§12.3) —
# homing pair-keyed data here would re-couple Format to platforms, which Q4 deleted.
#
# The genre's rhetorical structure is the entry's body prose: human-authoring reference,
# NOT a compose input (§15) — the writer receives only the bound attributes, the
# `parts`/`section_schema` structure, the grounded facts, and (when set) the DR-3 outline
# drive brief; the Format body is never threaded. The structural attributes are `parts`
# (Q14) and `section_schema` (DR-4).
# Composing two genres is TWO artifacts, grouped by a folio — never a composite (§5.2).
# Per-part cascade refinement is a deferred slot (§12.3, §26).
schema_version: 1
attributes:
  parts:
    type:
      type: list
      element: text
    default: []
    definition: >-
      Optional ORDERED list of named intra-genre sub-outputs, defined entirely inside
      this one governing Format entry (Q14, §5.2; e.g. slide-deck -> [slides,
      presenter-notes]). One format selected -> one artifact with named parts; part
      names surface as part Div ids in the IR/AST (§15). Empty = a single-part genre.
      Ordered `list` by design: `union` on it is a schema-validation ERROR (§11.1 CM3
      — format.parts is the design's own example) and cascade combination is replace.
    definition_version: 1
  # --- section_schema (DR-4 C3): the base genre's typed-section conformance contract -----------
  #
  # `section_schema` is the Format's OWN declared section contract — the platform-NEUTRAL base of
  # DR-4 typed-section conformance (§5.2, §15). It is an ORDERED list of typed rules in the C2
  # vocabulary (`pipeline.sections`: presence / order / count / length, each carrying a role- OR
  # type-axis selector and an {error,warning,info} severity). ROLES (e.g. `abstract`, `methods`,
  # `results`) are AUTHORED HERE as role-axis selectors — they are NOT structural `type` kinds and
  # never enter the `pipeline.sections.SECTION_TYPES` carrier (that carrier holds genre-neutral
  # STRUCTURAL kinds only: prose/figure/table/callout). Compose checks the composed body against
  # this base schema (C5); per-venue tightening lives on the Platform (`format_structural`, C6).
  #
  # FLOOR `[]` = NO contract. Every existing Format is byte-safe: an unset `section_schema` rides
  # the L0 floor (§12.2), is OMITTED by `delta_vs_floor` (ids.py §7.2 — a floored attribute never
  # enters the identity delta), and re-mints every artifact-id UNCHANGED. A missing attribute is
  # never an error (§11.1/§12.2).
  #
  # NIT #2 — MEANINGFUL ONLY ON OUTLINE-SHAPED FORMATS. `section_schema` describes a body's heading
  # skeleton, so it is meaningful ONLY on an OUTLINE-SHAPED Format (one whose composed IR body IS a
  # sectioned outline, DR-3). A NON-outline Format that declares one has NO outline scaffold to
  # check and NO `outline-digest` identity coverage of its structure: the base gate treats such a
  # Format as EXEMPT (documented, never silently "unconformant-by-absence") and SKIPS the check
  # cleanly rather than failing a body it cannot see. This "exempt vs unconformant-by-absence"
  # distinction is made unambiguous at the compose gate (C5) and recorded in the design (C11/§5.2).
  section_schema:
    type:
      type: list
      element:
        type: map
    default: []
    definition: >-
      The base genre's OWN typed-section conformance contract (DR-4, §5.2/§15): an ordered list
      of section-conformance rules in the `pipeline.sections` C2 vocabulary (presence/order/count/
      length; each with a role- or type-axis selector and an error|warning|info severity). Author
      ROLE selectors (e.g. abstract/methods/results) HERE — roles are author-declared, never
      structural `type` kinds (the SECTION_TYPES carrier holds structural kinds only). Floor `[]` =
      no contract: an unset value rides the L0 floor, is omitted from the §7.2 identity delta, and
      every existing artifact-id re-mints unchanged. Meaningful ONLY on outline-shaped Formats; a
      non-outline Format that declares one is treated as EXEMPT by the base gate (no outline
      scaffold, no outline-digest identity coverage), never silently unconformant-by-absence.
    definition_version: 1
  # --- diagram_disposition (DR-9): the deterministic diagram request/suppress knob ---------------
  #
  # `diagram_disposition` is the genre's stance on whether a composed artifact should carry a
  # diagram. It is an ENUM with the NEUTRAL empty member `""` as its floor — the `lexicons.spelling`
  # precedent (an empty-member enum is a genuine empty L0 floor). FLOOR `""` = the writer decides
  # (today's behavior): an unset Format rides `""`, which `delta_vs_floor` OMITS from the §7.2
  # identity delta (ids.py), so shipping this attribute re-mints every existing artifact-id
  # BYTE-IDENTICAL — zero churn. A neutral stance is the `""` floor, NEVER a literal `neutral`
  # token (a real token would enter the delta and churn every id — the trap this design avoids).
  #
  # The members split into HARD guarantees and SOFT prompt biases (DR-9): `suppress` = a hard
  # guarantee of NO diagram; `require` = a hard guarantee of a GROUNDED diagram that passes the
  # base HARD grounding gate, or the compose refuses (an illustrative/decorative figure does NOT
  # satisfy `require`); `resist`/`prefer` = SOFT writer-prompt biases against / toward a diagram
  # (a nudge, not a guarantee). Run-tunable per §13.2 via `--set format.diagram_disposition=…`;
  # a non-member typo is refused PRE-SPEND at plan resolution (the closed-schema enum validation,
  # attrtypes.py, reached through `validate_override_against_schema` at begin-session — before any
  # writer call), so an invalid value never spends a token.
  #
  # WIRED IN COMPOSE (DR-9, C4b): the per-artifact GATE and the writer directives now ACT on this
  # knob. `require` = compose ships a GROUNDED `{type=diagram}` section (one passing the base HARD
  # grounding gate) or REFUSES — an illustrative sketch never satisfies it; `suppress` = the
  # artifact carries NO diagram section; `resist`/`prefer` = SOFT writer-prompt biases (a nudge, not
  # a guarantee). A non-member typo is still refused PRE-SPEND at plan resolution (the closed-schema
  # enum validation), before any writer call. A per-artifact contradiction between this stance and
  # the Format's `section_schema` (e.g. a schema that forbids the diagram `require` demands) is
  # refused LOUDLY pre-writer, ZERO spend (compose D3).
  diagram_disposition:
    type:
      type: enum
      values: ["", suppress, resist, prefer, require]
    default: ""
    definition: >-
      The genre's stance on whether a composed artifact carries a diagram (DR-9). The floor is the
      NEUTRAL member `""` — the writer decides, today's behavior; an unset Format rides `""`, which
      is omitted from the §7.2 identity delta, so every existing artifact-id re-mints byte-identical
      (neutral is the `""` floor, never a literal token). HARD guarantees: `suppress` = no diagram;
      `require` = a GROUNDED diagram that passes the base grounding gate or the compose refuses (an
      illustrative figure never satisfies `require`). SOFT prompt biases: `resist` / `prefer` nudge
      the writer against / toward a diagram without guaranteeing the outcome. Run-tunable via `--set
      format.diagram_disposition=…`; a non-member value is refused pre-spend by the closed-schema
      enum validation at plan resolution, before any writer call.
    definition_version: 1
